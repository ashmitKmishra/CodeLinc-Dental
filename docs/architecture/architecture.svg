<text x="1035.0" y="608.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0A3D42" stroke="#F7FAFA" stroke-width="4" paint-order="stroke">context, vector search</text>
<rect x="1023.0" y="613.0" width="24" height="24" rx="12" fill="#F2B544" stroke="#0A3D42" stroke-width="1.4"/><text x="1035.0" y="629.5" font-size="13" font-weight="700" text-anchor="middle" fill="#10282D">3</text>
